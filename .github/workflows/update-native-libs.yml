name: Update native Android libraries

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check versions and dependency updates without building or publishing
        type: boolean
        default: false

permissions:
  contents: write

# Keep scheduled/manual update runs from racing for the same release tags.
concurrency:
  group: update-native-libs
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate update orchestration
        run: |
          python scripts/config.py validate
          python -m unittest discover -s tests -v

  independent:
    name: Update ${{ matrix.package }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        package: [libffi, libuv, openssl]
    uses: ./.github/workflows/update-package.yml
    with:
      package: ${{ matrix.package }}
      dry_run: ${{ inputs.dry_run || false }}

  libxml2:
    name: Update libxml2
    needs: validate
    uses: ./.github/workflows/update-package.yml
    with:
      package: libxml2
      dry_run: ${{ inputs.dry_run || false }}

  libxslt:
    name: Update libxslt
    needs: libxml2
    uses: ./.github/workflows/update-package.yml
    with:
      package: libxslt
      dry_run: ${{ inputs.dry_run || false }}
      dependencies: ${{ needs.libxml2.outputs.resolved }}
