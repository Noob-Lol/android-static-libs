name: Update native Android libraries

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check versions and dependency updates without building or publishing
        type: boolean
        default: false

permissions:
  contents: write

# Keep scheduled/manual update runs from racing for the same release tags.
concurrency:
  group: update-native-libs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate update orchestration
        run: |
          python scripts/config.py validate
          python -m unittest discover -s tests -v

      - name: Configure Android NDK environment
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}}"
          test -f "${ndk}/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=${ndk}" >> "${GITHUB_ENV}"

      - name: Check upstreams, build dependencies, and publish releases
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "${DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/updates.py "${args[@]}"

      - name: Upload update report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-library-update-report
          path: dist/updates/update-report.json
          if-no-files-found: ignore
